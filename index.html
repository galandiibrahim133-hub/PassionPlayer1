<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>COOKED</title>
<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}
body {
    background: #000;
    color: #fff;
    height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: Arial, sans-serif;
}
h1 {
    font-size: 38px;
    letter-spacing: 3px;
}
</style>
</head>
<body onclick="startMusic()">
<h1>COOKED</h1>
<audio id="music" src="sound.mp3" loop></audio>
<script>
function startMusic() {
    const music = document.getElementById("music");
    if (music.paused) {
        music.play().catch(console.error);
    }
}
</script>
</body>
</html>
